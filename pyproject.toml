[project]
name = "grok-repo-template"
version = "0.1.0"
description = "Grok-optimized GitHub repo template for Colossus/Dojo routing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]
jax = ["jax>=0.4", "jaxlib>=0.4"]
torch = ["torch>=2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
