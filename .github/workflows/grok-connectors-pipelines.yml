name: Grok Connectors Pipelines

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  github-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/connectors/github_pipeline.py

  web-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/connectors/web_pipeline.py

  code-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/connectors/code_execution_pipeline.py

  x-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/connectors/x_tools_pipeline.py
