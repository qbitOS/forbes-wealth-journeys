name: Standards Compliance

on:
  pull_request:
    paths:
      - "standards/**"
      - "metadata.yaml"
      - ".github/workflows/**"

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standards docs exist
        run: test -f standards/xai-spacex-terrafab-grokipedia.md
      - name: Validate metadata.yaml
        run: python -c "import yaml; yaml.safe_load(open('metadata.yaml'))"
